{% extends 'q_registration/login.html' %}
{% load static %}

{%block title%}Восстановление пароля{%endblock%}
{%block content%}
    <h1>Лёша Чёрт</h1>
    <form method="post">
        {%csrf_token%}
        {% for field in form %}
            {{field}}
            {{field.errors}}
        {%endfor%}
        <button type="submit">Изменить</button>
        {% for error in form.non_field_errors %}
            <div class="error">{{ error }}</div>
        {% endfor %}
    </form>
{%endblock%}
