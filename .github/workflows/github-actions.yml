name: Django CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Docker Compose
      run: sudo apt-get install docker-compose -y

    - name: Build and start containers
      run: docker-compose up --build -d

    - name: Wait for database to be ready
      run: |
        set -e
        until docker-compose exec -T database pg_isready -h database -p 5432; do
          echo "Waiting for database..."
          sleep 3
        done

    - name: Check containers status
      run: docker-compose ps

    - name: Run migrations
      run: |
        set -e
        docker-compose exec -T web-app python manage.py migrate || {
          echo "Migration failed. Displaying web-app logs:";
          docker-compose logs web-app;
          exit 1;
        }

    - name: Run tests
      run: |
        set -e
        docker-compose exec -T web-app python manage.py test || {
          echo "Tests failed. Displaying web-app logs:";
          docker-compose logs web-app;
          exit 1;
        }

    - name: Stop and remove containers
      if: always()
      run: docker-compose down
